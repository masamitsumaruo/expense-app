<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>経費精算アプリ</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <h1>経費精算</h1>
    <div class="period" id="currentPeriod"></div>
  </header>

  <!-- 登録ページ -->
  <div class="page active" id="page-add">
    <div class="card">
      <div class="camera-area" id="cameraArea">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6.827 6.175A2.31 2.31 0 015.186 7.23c-.38.054-.757.112-1.134.175C2.999 7.58 2.25 8.507 2.25 9.574V18a2.25 2.25 0 002.25 2.25h15A2.25 2.25 0 0021.75 18V9.574c0-1.067-.75-1.994-1.802-2.169a47.865 47.865 0 00-1.134-.175 2.31 2.31 0 01-1.64-1.055l-.822-1.316a2.192 2.192 0 00-1.736-1.039 48.774 48.774 0 00-5.232 0 2.192 2.192 0 00-1.736 1.039l-.821 1.316z"/>
          <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 12.75a4.5 4.5 0 11-9 0 4.5 4.5 0 019 0z"/>
        </svg>
        <p>レシート・領収書を撮影・選択</p>
      </div>
      <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none">
      <div class="ocr-progress" id="ocrProgress" style="display:none">
        <div class="spinner"></div>
        <p id="ocrStatus">読み取り中...</p>
      </div>
    </div>

    <div class="card" id="receiptForm" style="display:none">
      <div class="form-group">
        <label>日付</label>
        <input type="date" id="inputDate">
      </div>
      <div class="form-group">
        <label>店名・会社名</label>
        <input type="text" id="inputStore" placeholder="例: レストラン○○">
      </div>
      <div class="form-group">
        <label>金額</label>
        <input type="number" id="inputAmount" placeholder="0" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>明細</label>
        <textarea id="inputDetails" placeholder="品目やメモ"></textarea>
      </div>
      <div class="form-group">
        <label>同行者</label>
        <input type="text" id="inputCompanion" placeholder="例: 田中太郎、鈴木花子">
      </div>
      <div class="form-group">
        <label>目的</label>
        <input type="text" id="inputPurpose" placeholder="例: 取引先との打ち合わせ">
      </div>
      <div class="form-group">
        <label>添付資料（案内状・領収書など）</label>
        <div class="attachment-area" id="addAttachmentArea">
          <input type="file" id="inputAttachments" multiple accept="image/*,application/pdf,.jpg,.jpeg,.png" style="display:none">
          <button type="button" class="btn btn-outline btn-sm" id="btnAddAttachment">ファイルを追加</button>
          <button type="button" class="btn btn-outline btn-sm" id="btnCameraAttachment">カメラで撮影</button>
          <input type="file" id="inputCameraAttachment" accept="image/*" capture="environment" style="display:none">
          <div class="attachment-list" id="addAttachmentList"></div>
        </div>
      </div>
      <button class="btn btn-primary" id="btnSave">保存する</button>
    </div>

    <div style="text-align:center; margin-top:8px;">
      <button class="btn btn-outline btn-sm" id="btnManualAdd">手動で入力する</button>
    </div>
  </div>

  <!-- 一覧ページ -->
  <div class="page" id="page-list">
    <div class="period-select">
      <select id="periodSelect"></select>
    </div>
    <div class="total-bar">
      <span>合計</span>
      <span class="total-amount" id="totalAmount">¥0</span>
    </div>
    <div id="submissionNotice" class="submission-notice" style="display:none">
      本日は提出日（21日）です。CSVを作成して総務に送信しましょう。
    </div>
    <div class="card">
      <ul class="receipt-list" id="receiptList"></ul>
      <div class="empty-state" id="emptyState">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/>
        </svg>
        <p>レシートがまだありません</p>
      </div>
    </div>
  </div>

  <!-- CSV・送信ページ -->
  <div class="page" id="page-export">
    <div class="card">
      <h2 style="font-size:16px; margin-bottom:12px;">CSV出力・送信</h2>
      <div class="period-select">
        <select id="exportPeriodSelect"></select>
      </div>
      <div id="exportSummary" style="margin-bottom:16px;"></div>
      <button class="btn btn-primary" id="btnDownloadCSV" style="margin-bottom:8px;">CSVをダウンロード</button>
      <button class="btn btn-success" id="btnSendEmail">メールで総務に送信</button>
    </div>
    <div class="card" style="margin-top: 12px;">
      <div class="form-group">
        <label>総務メールアドレス</label>
        <input type="email" id="inputSoumuEmail" placeholder="soumu@example.com">
      </div>
      <button class="btn btn-outline btn-sm" id="btnSaveSoumuEmail">メールアドレスを保存</button>
    </div>
  </div>

  <!-- 設定ページ -->
  <div class="page" id="page-settings">
    <div class="card">
      <h2 style="font-size:16px; margin-bottom:16px;">ユーザー設定</h2>
      <div class="form-group">
        <label>氏名</label>
        <input type="text" id="settingName" placeholder="山田太郎">
      </div>
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="settingEmail" placeholder="your@email.com">
      </div>
      <div class="form-group">
        <label>部署</label>
        <input type="text" id="settingDept" placeholder="営業部">
      </div>
      <button class="btn btn-primary" id="btnSaveProfile">設定を保存</button>
    </div>
    <div class="card" style="margin-top:12px;">
      <h2 style="font-size:16px; margin-bottom:12px;">データ管理</h2>
      <button class="btn btn-danger btn-sm" id="btnClearData">全データを削除</button>
    </div>
  </div>

  <!-- 編集モーダル -->
  <div class="modal-overlay" id="editModal">
    <div class="modal">
      <h2>レシート編集</h2>
      <div class="form-group">
        <label>日付</label>
        <input type="date" id="editDate">
      </div>
      <div class="form-group">
        <label>店名・会社名</label>
        <input type="text" id="editStore">
      </div>
      <div class="form-group">
        <label>金額</label>
        <input type="number" id="editAmount" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>明細</label>
        <textarea id="editDetails"></textarea>
      </div>
      <div class="form-group">
        <label>同行者</label>
        <input type="text" id="editCompanion">
      </div>
      <div class="form-group">
        <label>目的</label>
        <input type="text" id="editPurpose">
      </div>
      <div class="form-group">
        <label>添付資料</label>
        <div class="attachment-area">
          <input type="file" id="editAttachments" multiple accept="image/*,application/pdf,.jpg,.jpeg,.png" style="display:none">
          <button type="button" class="btn btn-outline btn-sm" id="btnEditAttachment">ファイルを追加</button>
          <button type="button" class="btn btn-outline btn-sm" id="btnEditCameraAttachment">カメラで撮影</button>
          <input type="file" id="editCameraAttachment" accept="image/*" capture="environment" style="display:none">
          <div class="attachment-list" id="editAttachmentList"></div>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="btnCancelEdit">キャンセル</button>
        <button class="btn btn-primary" id="btnSaveEdit">更新</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <!-- タブバー -->
  <nav class="tab-bar">
    <button class="active" data-page="page-add">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15"/>
      </svg>
      登録
    </button>
    <button data-page="page-list">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M8.25 6.75h12M8.25 12h12m-12 5.25h12M3.75 6.75h.007v.008H3.75V6.75zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zM3.75 12h.007v.008H3.75V12zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0zm-.375 5.25h.007v.008H3.75v-.008zm.375 0a.375.375 0 11-.75 0 .375.375 0 01.75 0z"/>
      </svg>
      一覧
    </button>
    <button data-page="page-export">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M16.5 12L12 16.5m0 0L7.5 12m4.5 4.5V3"/>
      </svg>
      出力
    </button>
    <button data-page="page-settings">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M9.594 3.94c.09-.542.56-.94 1.11-.94h2.593c.55 0 1.02.398 1.11.94l.213 1.281c.063.374.313.686.645.87.074.04.147.083.22.127.324.196.72.257 1.075.124l1.217-.456a1.125 1.125 0 011.37.49l1.296 2.247a1.125 1.125 0 01-.26 1.431l-1.003.827c-.293.24-.438.613-.431.992a6.759 6.759 0 010 .255c-.007.378.138.75.43.99l1.005.828c.424.35.534.954.26 1.43l-1.298 2.247a1.125 1.125 0 01-1.369.491l-1.217-.456c-.355-.133-.75-.072-1.076.124a6.57 6.57 0 01-.22.128c-.331.183-.581.495-.644.869l-.213 1.28c-.09.543-.56.941-1.11.941h-2.594c-.55 0-1.02-.398-1.11-.94l-.213-1.281c-.062-.374-.312-.686-.644-.87a6.52 6.52 0 01-.22-.127c-.325-.196-.72-.257-1.076-.124l-1.217.456a1.125 1.125 0 01-1.369-.49l-1.297-2.247a1.125 1.125 0 01.26-1.431l1.004-.827c.292-.24.437-.613.43-.992a6.932 6.932 0 010-.255c.007-.378-.138-.75-.43-.99l-1.004-.828a1.125 1.125 0 01-.26-1.43l1.297-2.247a1.125 1.125 0 011.37-.491l1.216.456c.356.133.751.072 1.076-.124.072-.044.146-.087.22-.128.332-.183.582-.495.644-.869l.214-1.281z"/>
        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
      </svg>
      設定
    </button>
  </nav>

  <script src="js/config.js"></script>
  <script src="js/db.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/ocr.js"></script>
  <script src="js/csv.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
